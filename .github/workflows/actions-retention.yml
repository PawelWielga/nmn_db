name: GitHub | Actions Retention
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-retention.yml']
  schedule:
    - cron: '30 3 * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: actions-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Actions data older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '3 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[]? | select(.created_at < \"${cutoff}\") | .id" | while read -r id; do [ -z "${id}" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" --jq ".workflow_runs[]? | select(.created_at < \"${cutoff}\") | .id" | while read -r id; do [ -z "${id}" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}"; done
